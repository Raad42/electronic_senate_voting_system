[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "senate-common"
version = "0.1.0"
description = "Code shared by every Senate voting service: settings, tokens, crypto, audit chain, clients"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.9,<3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9,<3",
    "cryptography>=43",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["common*"]
