# Author: Zak
# Edits:
#
# Front door: HTTPS for browsers, rate limiting (GR04), mutual TLS to every service,
# and /internal/* is never reachable from outside.
#
# Requirements:
#     GR04 - each IP address gets 30 logins a minute, 20 votes a minute and 10 other requests a second
#     GR02 and GR03 - internal routes can never be reached from outside
#
# Run:
#     docker compose up -d --build
#     The site is then on https://localhost:8443
#
# Usage example:
#     for i in $(seq 1 30); do curl -sk -o /dev/null -w "%{http_code} " -X POST \
#       https://localhost:8443/api/auth/elector/authorisation -H 'Content-Type: application/json' \
#       -d '{"state":"SA","voterId":"SA-0005","password":"wrong","electionId":"senate-2026"}'; done
#
# Output:
#     The first few come back 401 because the password is wrong
#     After that Nginx returns 429 Too Many Requests with Retry-After set to 60 seconds
#
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    server_tokens off;

    # ---- GR04: rate and connection limits, per client IP ----
    limit_req_zone  $binary_remote_addr zone=login:10m rate=30r/m;   # credential endpoints (polling places share IPs)
    limit_req_zone  $binary_remote_addr zone=vote:10m  rate=20r/m;   # casting ballots
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;   # everything else
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Slow-client and oversized-request protection
    client_max_body_size   64k;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      15s;
    send_timeout           10s;

    # ---- mTLS to upstream services: present our client cert, verify theirs ----
    proxy_ssl_certificate         /etc/nginx/keys/client.crt;
    proxy_ssl_certificate_key     /etc/nginx/keys/client.key;
    proxy_ssl_trusted_certificate /etc/nginx/keys/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_server_name         on;
    proxy_ssl_session_reuse       on;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;   # counts can take a while on big contests
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/keys/server.crt;
        ssl_certificate_key /etc/nginx/keys/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        limit_conn perip 20;

        # GR04: rate-limited requests get the same JSON error shape as the services, plus Retry-After.
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Wait a minute and try again."},"detail":"Too many requests"}';
        }

        # Internal endpoints are service-to-service only.
        location ~ /internal(/|$) { return 404; }

        # ---- Frontend contract (frontend/src/api/client.ts) ----
        location = /api/auth/elector/authorisation {
            limit_req zone=login burst=20 nodelay;
            proxy_pass https://auth:8443/elector/authorisation;
        }
        location = /api/ballots {
            limit_req zone=vote burst=5 nodelay;
            proxy_pass https://ballot:8443/ballots/ranked;
        }
        location = /api/ballots/config {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://ballot:8443/ballots/config;   # the query string is passed through
        }
        # /api/auth/session, /api/recount/exclusions and /api/audit/events use the prefix routes below.

        # Tighter limits on credential and voting endpoints
        location = /api/auth/officials/login {
            limit_req zone=login burst=20 nodelay;
            proxy_pass https://auth:8443/officials/login;
        }
        location = /api/auth/officials/step-up {
            limit_req zone=login burst=20 nodelay;
            proxy_pass https://auth:8443/officials/step-up;
        }
        location = /api/auth/electors/authorise {
            limit_req zone=login burst=20 nodelay;
            proxy_pass https://auth:8443/electors/authorise;
        }
        location = /api/ballot/ballots {
            limit_req zone=vote burst=5 nodelay;
            proxy_pass https://ballot:8443/ballots;
        }

        # Prefix routes: /api/<service>/x -> https://<service>:8443/x
        location /api/auth/    { limit_req zone=api burst=20 nodelay; proxy_pass https://auth:8443/; }
        location /api/ballot/  { limit_req zone=api burst=20 nodelay; proxy_pass https://ballot:8443/; }
        location /api/count/   { limit_req zone=api burst=5  nodelay; proxy_pass https://count:8443/; }
        location /api/recount/ { limit_req zone=api burst=5  nodelay; proxy_pass https://recount:8443/; }
        location /api/audit/   { limit_req zone=api burst=20 nodelay; proxy_pass https://audit:8443/; }
        location /api/         { return 404; }

        # React build (frontend/dist)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
